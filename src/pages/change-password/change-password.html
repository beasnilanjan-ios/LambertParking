<ion-header>
    <ion-navbar>
      <button class="custom-nav-icon" ion-button menuToggle>
        <ion-icon name="navbar"></ion-icon>
      </button>
      <ion-title text-center>Lambert Parking</ion-title>
    </ion-navbar>
  </ion-header>


  <ion-content padding>
    <ion-list>
      <div class="fild-input">
        <h3 text-center style="color: black; margin-top: 50px;">Change Password</h3>
        <div class="form-control">
          <ion-input placeholder="Old password" (keyup.enter)="hideKeyboard()" type="password" [(ngModel)]="data.oldPassword">
          </ion-input>
        </div>

        <div class="form-control">
          <ion-input placeholder="New password" (keyup.enter)="hideKeyboard()" type="password" [(ngModel)]="data.password">
          </ion-input>
        </div>

        <div class="form-control">
          <ion-input placeholder="Confirm password" (keyup.enter)="hideKeyboard()" type="password" [(ngModel)]="data.confirmPassword">
          </ion-input>
        </div>
      </div>
      
      <div class="log-btn">
        <button class="buttonMargin" ion-button full round (click)="changePassword()">Submit</button>
      </div>
    </ion-list>
  </ion-content>
