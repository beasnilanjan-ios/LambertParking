<ion-header>

  <ion-navbar>
    <ion-title>Lambert Parking</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>
  <ion-list>
    <div class="fild-input">
      <h3 text-center style="color: black; margin-top: 50px;">Citizen Forgot Password</h3>
      <div class="form-control">
        <ion-input placeholder="Mobile Number" (keyup.enter)="hideKeyboard()" [(ngModel)]="data.phone" type="tel"
          maxlength="10" pattern="[0-9]+"></ion-input>
      </div>
    </div>

    <div class="log-btn">
      <button class="buttonMargin" ion-button full round (click)="forgotPassword()">Submit</button>
    </div>
  </ion-list>

</ion-content>
