<ion-header>

  <ion-navbar>
    <ion-title>Bluetooth Modal</ion-title>
  </ion-navbar>

</ion-header>


<ion-content padding>
  <button ion-button full class="submit-button" (click)="listPairedDevices()">
    <ion-icon name="refresh"></ion-icon>&nbsp;Refresh Bluetooth Devices</button>
  <ion-row>
    <ion-col>
      <ion-list radio-group [(ngModel)]="pairedDeviceID" *ngIf="listToggle">
        <ion-item *ngFor="let i of pairedList;let j=index">
          <ion-label>{{i.name}}</ion-label>
          <ion-radio value="{{j}}" ></ion-radio>
        </ion-item>
      </ion-list>
    </ion-col>
  </ion-row>
  <button ion-button full class="submit-button" *ngIf="listToggle" (click)="selectDevice()">
    <ion-icon name="bluetooth"></ion-icon>&nbsp;Connect Bluetooth Devices</button>  
  <!-- <button style="margin-top: 20px;" ion-button full class="submit-button" (click)="openGate()">
    <ion-icon name="send"></ion-icon>&nbsp;Open Gate
  </button>
  <button style="margin-top: 10px;" ion-button full class="submit-button" (click)="closeGate()">
    <ion-icon name="send"></ion-icon>&nbsp;Close Gate
  </button> -->
  <button style="margin-top: 20px;" ion-button full class="submit-button" (click)="back()">
    <ion-icon name="send"></ion-icon>&nbsp;Back
  </button>
</ion-content>
