<ion-header>
  <ion-navbar>
    <ion-title>New Profile</ion-title>
  </ion-navbar>
</ion-header>


<ion-content padding class="bg-image">
  <ion-list>
      <div>
          <h3 text-center style="color: #fff; margin-top: 50px;">Sign Up</h3>
      </div>
    <ion-item> 
      <ion-label floating>Name</ion-label>
      <ion-input (keyup.enter)="hideKeyboard()" [(ngModel)]="dataToSend.name"></ion-input>
    </ion-item>
    <ion-item> 
      <ion-label floating>Address</ion-label>
      <ion-input (keyup.enter)="hideKeyboard()" [(ngModel)]="dataToSend.address"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label floating>Contact Number</ion-label>
      <ion-input (keyup.enter)="hideKeyboard()" [(ngModel)]="dataToSend.mobile_no" type="tel" maxlength="10" pattern="[0-9]+"></ion-input>
    </ion-item>
