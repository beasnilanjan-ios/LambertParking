<ion-header>
  <ion-navbar>
    <ion-title text-center>Lambert Parking</ion-title>
  </ion-navbar>
</ion-header>

<!-- <ion-content padding class="bg-image"> Commented because the background image is not requred here-->
<ion-content padding>
  <ion-list>
    <!-- <ion-item>  
        <img class="imgLogo" src="../assets/imgs/Logo.png" alt="Logo" placeholder="9999988888" value="9999988888"  placeholder="123456" value="123456">
    </ion-item> -->
    <div class="fild-input">
      <h3 text-center style="color: black; margin-top: 50px;">Attendant Login</h3>
      <div class="form-control">
        <!-- <ion-label floating>Mobile Number</ion-label> -->
        <ion-input placeholder="Mobile Number" (keyup.enter)="hideKeyboard()" [(ngModel)]="data.phone" type="tel"
          maxlength="10" pattern="[0-9]+"></ion-input>
      </div>
      <div class="form-control">
        <!-- <ion-label floating>Password</ion-label> -->
        <ion-input placeholder="Password" (keyup.enter)="hideKeyboard()" type="password" [(ngModel)]="data.password">
        </ion-input>
      </div>

    </div>
    <div style="background-color: transparent;" text-center>
      <button class="sign-up" (click)="forgotPassword()"><span style="color: #488aff">Forgot password?</span></button>
    </div>
    <div class="log-btn">
      <button class="buttonMargin" ion-button full round (click)="login()">Log In</button>
    </div>
    <!-- <ion-label>{{response.name}}</ion-label> -->
  </ion-list>
</ion-content>
